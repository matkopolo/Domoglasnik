name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate -d real_estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://real_estate:real_estate@localhost:5432/real_estate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
