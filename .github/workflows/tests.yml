name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate -d real_estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://real_estate:real_estate@localhost:5432/real_estate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/data-pipeline/pyproject.toml
            apps/data-pipeline/requirements*.txt
      - run: pip install -e ".[dev,ml]"
        working-directory: apps/data-pipeline
      - run: ruff check .
        working-directory: apps/data-pipeline
      - run: pytest -q
        working-directory: apps/data-pipeline
      - name: Apply database migrations
        run: |
          for migration in database/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/api/go.sum
      - run: gofmt -w . && git diff --exit-code
        working-directory: apps/api
      - run: go vet ./...
        working-directory: apps/api
      - run: go build ./...
        working-directory: apps/api
      - run: go test -race ./...
        working-directory: apps/api
