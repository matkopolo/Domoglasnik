name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: real_estate
          POSTGRES_USER: real_estate
          POSTGRES_PASSWORD: real_estate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_estate -d real_estate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://real_estate:real_estate@localhost:5432/real_estate

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/data-pipeline/pyproject.toml
            apps/data-pipeline/requirements*.txt
      - run: pip install -e ".[dev,ml]"
        working-directory: apps/data-pipeline
      - run: ruff check .
        working-directory: apps/data-pipeline
      # Python publication integration tests require the same migrated schema as Go.
      - name: Apply database migrations
        run: |
          for migration in database/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run pipeline unit and integration tests
        run: pytest -q
        working-directory: apps/data-pipeline
      - name: Build pipeline worker
        run: docker build -t real-estate-data-pipeline:test apps/data-pipeline
      - name: Validate Compose services
        run: docker compose config --quiet
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: apps/real-estate-api/go.sum
      - run: gofmt -w . && git diff --exit-code
        working-directory: apps/real-estate-api
      - run: go vet ./...
        working-directory: apps/real-estate-api
      - run: go build ./...
        working-directory: apps/real-estate-api
      - run: go test -race ./...
        working-directory: apps/real-estate-api
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - name: Verify generated API contract
        run: npm run generate:api-types && git diff --exit-code -- lib/generated/api-schema.d.ts
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - name: Test production migrations on disposable databases
        run: MIGRATION_TEST_DATABASE_URL="$TEST_DATABASE_URL" pytest -q database/tests
      - name: Build production images (same-origin web)
        run: |
          docker build -t real-estate-api:test apps/real-estate-api
          docker build --build-arg NEXT_PUBLIC_API_URL= -t real-estate-web:test apps/web
          docker build -t real-estate-migrations:test -f infrastructure/docker/migrations/Dockerfile .
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.8
      - name: Validate pinned Kubernetes schemas
        run: |
          pip install -r infrastructure/kubernetes/scripts/requirements.txt
          . infrastructure/kubernetes/addons/versions.env
          curl -fsSL "$CNPG_MANIFEST" -o /tmp/cnpg.yaml
          curl -fsSL "$BARMAN_MANIFEST" -o /tmp/barman.yaml
          python infrastructure/kubernetes/scripts/validate.py /tmp/cnpg.yaml /tmp/barman.yaml
      - name: Disposable K3s dry-run smoke (no historical import or training)
        run: python infrastructure/kubernetes/scripts/smoke.py

  images:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: apps/real-estate-api
            file: apps/real-estate-api/Dockerfile
          - image: web
            context: apps/web
            file: apps/web/Dockerfile
          - image: pipeline
            context: apps/data-pipeline
            file: apps/data-pipeline/Dockerfile
          - image: migrations
            context: .
            file: infrastructure/docker/migrations/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/matkopolo/nepremicninskiagent-${{ matrix.image }}:sha-${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=
          provenance: mode=max
          sbom: true
