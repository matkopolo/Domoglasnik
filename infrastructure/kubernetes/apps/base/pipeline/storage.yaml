apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "pipeline-data"
  labels:
    app.kubernetes.io/name: "pipeline-data"
    app.kubernetes.io/component: "configuration"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
spec:
  accessModes:
    - "ReadWriteOnce"
  storageClassName: "local-path"
  resources:
    requests:
      storage: "40Gi"
