apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "pipeline-worker"
  labels:
    app.kubernetes.io/name: "pipeline-worker"
    app.kubernetes.io/component: "pipeline"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app.kubernetes.io/name: "pipeline-worker"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "pipeline-worker"
        app.kubernetes.io/component: "pipeline"
        app.kubernetes.io/part-of: "real-estate"
        app.kubernetes.io/version: "sha-RELEASE_SHA"
        app.kubernetes.io/managed-by: "kustomize"
    spec:
      serviceAccountName: "real-estate-workload"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "pipeline"
          image: "ghcr.io/matkopolo/nepremicninskiagent-pipeline:sha-RELEASE_SHA"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          envFrom:
            -
              configMapRef:
                name: "runtime-config"
          env:
            -
              name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "real-estate-pipeline-db"
                  key: "uri"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            -
              name: "tmp"
              mountPath: "/tmp"
            -
              name: "database-ca"
              mountPath: "/etc/database-ca"
              readOnly: true
            -
              name: "pipeline-data"
              mountPath: "/data"
          args:
            - "schedule"
            - "--interval-days"
            - "14"
            - "--retry-hours"
            - "1"
            - "--workers"
            - "2"
            - "--output-dir"
            - "/data/raw"
            - "--health-file"
            - "/tmp/pipeline-healthy"
          readinessProbe:
            exec:
              command:
                - "python"
                - "-c"
                - "from pathlib import Path; raise SystemExit(not Path('/tmp/pipeline-healthy').exists())"
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "database-ca"
          secret:
            secretName: "real-estate-db-ca"
            items:
              -
                key: "ca.crt"
                path: "ca.crt"
        -
          name: "pipeline-data"
          persistentVolumeClaim:
            claimName: "pipeline-data"
