apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "web"
  labels:
    app.kubernetes.io/name: "web"
    app.kubernetes.io/component: "web"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: "web"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "web"
        app.kubernetes.io/component: "web"
        app.kubernetes.io/part-of: "real-estate"
        app.kubernetes.io/version: "sha-RELEASE_SHA"
        app.kubernetes.io/managed-by: "kustomize"
    spec:
      serviceAccountName: "real-estate-workload"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "web"
          image: "ghcr.io/matkopolo/nepremicninskiagent-web:sha-RELEASE_SHA"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          envFrom:
            -
              configMapRef:
                name: "runtime-config"
          env:
            -
              name: "HOSTNAME"
              value: "0.0.0.0"
            -
              name: "PORT"
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          volumeMounts:
            -
              name: "tmp"
              mountPath: "/tmp"
            -
              name: "next-cache"
              mountPath: "/app/.next/cache"
          ports:
            -
              name: "http"
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: "/"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: "/"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "next-cache"
          emptyDir:
            sizeLimit: "256Mi"
