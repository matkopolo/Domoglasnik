apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "runtime-config"
  labels:
    app.kubernetes.io/name: "runtime-config"
    app.kubernetes.io/component: "configuration"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
data:
  API_ENV: "production"
  API_NAME: "real-estate-api"
  API_ADDRESS: ":8080"
  API_BUILD: "sha-RELEASE_SHA"
  LOG_LEVEL: "info"
  DATABASE_MAX_CONNECTIONS: "10"
  API_ALLOWED_ORIGINS: "https://app.example.invalid"
  CACHE_ENABLED: "false"
  MODEL_REFRESH_POLICY: "manual"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ANALYTICS_PROGRESS_INTERVAL_SECONDS: "15"
  MODEL_DETAILED_PROGRESS: "false"
