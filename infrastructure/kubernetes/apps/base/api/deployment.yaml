apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "real-estate-api"
  labels:
    app.kubernetes.io/name: "real-estate-api"
    app.kubernetes.io/component: "api"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: "real-estate-api"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "real-estate-api"
        app.kubernetes.io/component: "api"
        app.kubernetes.io/part-of: "real-estate"
        app.kubernetes.io/version: "sha-RELEASE_SHA"
        app.kubernetes.io/managed-by: "kustomize"
    spec:
      serviceAccountName: "real-estate-workload"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "api"
          image: "ghcr.io/matkopolo/nepremicninskiagent-api:sha-RELEASE_SHA"
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          envFrom:
            -
              configMapRef:
                name: "runtime-config"
          env:
            -
              name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "real-estate-api-db"
                  key: "uri"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            -
              name: "tmp"
              mountPath: "/tmp"
            -
              name: "database-ca"
              mountPath: "/etc/database-ca"
              readOnly: true
          ports:
            -
              name: "http"
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: "/health/ready"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/health/live"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: "/health/live"
              port: "http"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "database-ca"
          secret:
            secretName: "real-estate-db-ca"
            items:
              -
                key: "ca.crt"
                path: "ca.crt"
