apiVersion: "batch/v1"
kind: "Job"
metadata:
  labels:
    app.kubernetes.io/name: "models-refresh"
    app.kubernetes.io/component: "maintenance"
    app.kubernetes.io/part-of: "real-estate"
    app.kubernetes.io/version: "sha-RELEASE_SHA"
    app.kubernetes.io/managed-by: "kustomize"
  name: "models-refresh-manual"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "models-refresh"
        app.kubernetes.io/component: "maintenance"
        app.kubernetes.io/part-of: "real-estate"
        app.kubernetes.io/version: "sha-RELEASE_SHA"
        app.kubernetes.io/managed-by: "kustomize"
    spec:
      restartPolicy: "Never"
      serviceAccountName: "real-estate-workload"
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "models-refresh"
          image: "ghcr.io/matkopolo/nepremicninskiagent-pipeline:sha-RELEASE_SHA"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          envFrom:
            -
              configMapRef:
                name: "runtime-config"
          env:
            -
              name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "real-estate-pipeline-db"
                  key: "uri"
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            -
              name: "tmp"
              mountPath: "/tmp"
            -
              name: "database-ca"
              mountPath: "/etc/database-ca"
              readOnly: true
          args:
            - "refresh-models"
            - "--workers"
            - "2"
      volumes:
        -
          name: "tmp"
          emptyDir:
            sizeLimit: "256Mi"
        -
          name: "database-ca"
          secret:
            secretName: "real-estate-db-ca"
            items:
              -
                key: "ca.crt"
                path: "ca.crt"
