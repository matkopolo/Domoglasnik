apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-http01
  labels:
    app.kubernetes.io/name: acme-http01
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: real-estate
    app.kubernetes.io/version: sha-RELEASE_SHA
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
