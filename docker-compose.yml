services:
  db:
    build:
      context: .
      dockerfile: infrastructure/docker/database/Dockerfile
    image: real-estate-postgis:16
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: real_estate
    ports:
      - "5432:5432"
    mem_limit: 4g
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: real-estate-api:development
    environment:
      API_ENV: development
      API_BUILD: local
      API_ADDRESS: ":8080"
      API_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      DATABASE_URL: postgresql://real_estate_api:real_estate_api@db:5432/real_estate
      DATABASE_MAX_CONNECTIONS: 10
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: real-estate-web:development
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    mem_limit: 768m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
