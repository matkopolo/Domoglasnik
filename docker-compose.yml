services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: real_estate
      POSTGRES_USER: real_estate
      POSTGRES_PASSWORD: real_estate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U real_estate -d real_estate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
